<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Подписание АВР · Contrast</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; color: #1d241b; background: #eef5e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; background: radial-gradient(circle at top left, #dfffca, transparent 40%), #eef5e9; }
    .card { width: min(560px, 100%); background: rgba(255,255,255,.96); border: 1px solid #cfe1c4; border-radius: 24px; padding: 24px; box-shadow: 0 24px 70px rgba(35,63,24,.14); }
    .eyebrow { color: #43a519; font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 7px 0 4px; font-size: clamp(24px, 6vw, 34px); }
    .muted { color: #747d70; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
    .summary div { padding: 12px; background: #f4f7f1; border-radius: 14px; }
    .summary small { display: block; color: #81897d; margin-bottom: 5px; }
    .summary strong { font-size: 14px; overflow-wrap: anywhere; }
    .actions { display: grid; gap: 8px; }
    button, .button { width: 100%; min-height: 48px; border: 1px solid #87cb65; border-radius: 14px; background: #d9ffbf; color: #20351a; font: inherit; font-weight: 850; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; }
    .button.secondary, button.secondary { background: #fff; border-color: #cfd8ca; }
    button:disabled { cursor: wait; opacity: .65; }
    .preview { margin-top: 1px; }
    .desktop-note { margin: 9px 0 0; font-size: 13px; }
    .sign-box { display: none; text-align: center; margin-top: 18px; padding-top: 18px; border-top: 1px solid #e2e8de; }
    .sign-box.visible { display: block; }
    .qr { width: min(280px, 85vw); height: min(280px, 85vw); object-fit: contain; border: 10px solid white; border-radius: 16px; box-shadow: 0 8px 26px rgba(0,0,0,.1); }
    .status { min-height: 44px; margin-top: 14px; padding: 12px; border-radius: 12px; background: #f2f5ef; font-size: 14px; overflow-wrap: anywhere; }
    .status.ok { color: #175d25; background: #e0f8d8; }
    .status.bad { color: #8a2b22; background: #fff0ec; }
    @media (max-width: 500px) { .card { padding: 18px; border-radius: 18px; } .summary { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Contrast Finance</div>
    <h1>Подписание АВР</h1>
    <p id="lead" class="muted">Загружаем данные документа…</p>
    <section id="summary" class="summary" hidden>
      <div><small>Документ</small><strong id="actNumber">—</strong></div>
      <div><small>Сумма</small><strong id="amount">—</strong></div>
      <div><small>ИП Contrast Event</small><strong id="customerStatus">Ожидается</strong></div>
      <div><small id="contractorLabel">Самозанятый</small><strong id="contractorStatus">Ожидается</strong></div>
    </section>
    <section class="actions">
      <button id="startBtn" type="button" hidden>Подписать через eGov Mobile</button>
      <button id="ncalayerBtn" class="secondary" type="button" hidden>Подписать ЭЦП через NCALayer</button>
      <a id="previewBtn" class="button secondary preview" href="#" target="_blank" rel="noopener" hidden>Открыть АВР</a>
    </section>
    <p id="desktopNote" class="desktop-note muted" hidden>Для ЭЦП на компьютере должен быть запущен NCALayer.</p>
    <section id="signBox" class="sign-box" aria-live="polite">
      <img id="qr" class="qr" alt="QR для подписания в eGov Mobile" />
      <p class="muted">Откройте eGov Mobile на телефоне и отсканируйте этот QR.</p>
    </section>
    <div id="status" class="status">Проверяем ссылку…</div>
  </main>
  <script>
    (() => {
      const token = location.pathname.split("/").filter(Boolean).pop();
      const $ = (id) => document.getElementById(id);
      const ua = navigator.userAgent || "";
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua)
        || (navigator.maxTouchPoints > 1 && /MacIntel/i.test(navigator.platform || ""))
        || matchMedia("(max-width: 820px) and (pointer: coarse)").matches;
      let timer = null;
      let currentInfo = null;

      const money = (value) => `${new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(Number(value || 0))} ₸`;
      const setStatus = (text, type = "") => { $("status").textContent = text; $("status").className = `status ${type}`.trim(); };
      const stopPolling = () => { if (timer) clearInterval(timer); timer = null; };
      const startPolling = () => { if (!timer) timer = setInterval(poll, 2500); };
      const setSigningButtonsDisabled = (value) => {
        $("startBtn").disabled = value;
        $("ncalayerBtn").disabled = value;
      };

      async function request(path, options) {
        const response = await fetch(`/sign/avr/${encodeURIComponent(token)}${path}`, options);
        let data = null;
        try { data = await response.json(); } catch (_) {}
        if (!response.ok) throw new Error(typeof data?.detail === "string" ? data.detail : `Ошибка ${response.status}`);
        return data;
      }

      const partyStatus = (value) => value === "signed" ? "✓ Подписано" : "Ожидается";
      function applyInfo(data) {
        currentInfo = data;
        $("lead").textContent = data.status === "signed"
          ? (data.signed_file_ready
            ? "Документ подписан обеими сторонами. PDF с ЭЦП и QR готов."
            : "Обе подписи сохранены. Формируем итоговый PDF с ЭЦП и QR.")
          : "Проверьте АВР и подпишите его. Сторона определится автоматически по ИИН вашей ЭЦП.";
        $("actNumber").textContent = `${data.act_number} от ${new Date(`${data.act_date}T00:00:00`).toLocaleDateString("ru-RU")}`;
        $("amount").textContent = money(data.amount);
        $("customerStatus").textContent = partyStatus(data.customer_status);
        $("contractorLabel").textContent = data.contractor_name || "Самозанятый";
        $("contractorStatus").textContent = partyStatus(data.contractor_status);
        $("summary").hidden = false;
        $("previewBtn").hidden = data.status === "signed" && !data.signed_file_ready;
        $("previewBtn").href = `/sign/avr/${encodeURIComponent(token)}/file${data.status === "signed" && data.signed_file_ready ? "?download=1" : ""}`;
        $("previewBtn").textContent = data.status === "signed" && data.signed_file_ready
          ? "Скачать подписанный АВР"
          : "Открыть АВР";
        if (data.status === "signed" && data.signed_file_ready) {
          $("previewBtn").setAttribute("download", `${data.act_number || "АВР"}_SIGNED_SIGEX.pdf`);
        } else {
          $("previewBtn").removeAttribute("download");
        }
      }

      async function refreshInfo() {
        const data = await request("/info");
        applyInfo(data);
        return data;
      }

      function showReady(secondParty = false) {
        $("signBox").classList.remove("visible");
        $("startBtn").hidden = false;
        $("startBtn").disabled = false;
        $("startBtn").textContent = isMobile
          ? (secondParty ? "Подписать второй стороной в eGov Mobile" : "Подписать через eGov Mobile")
          : (secondParty ? "QR для подписи второй стороны" : "Показать QR для eGov Mobile");
        $("ncalayerBtn").hidden = isMobile;
        $("ncalayerBtn").disabled = false;
        $("ncalayerBtn").textContent = "Подписать ЭЦП через NCALayer";
        $("desktopNote").hidden = isMobile;
      }

      function renderSession(data, options = {}) {
        const allowMobileLaunch = Boolean(options.allowMobileLaunch);
        if (data.status === "document_building" || data.status === "document_error") {
          $("startBtn").hidden = true;
          $("ncalayerBtn").hidden = true;
          $("desktopNote").hidden = true;
          $("signBox").classList.remove("visible");
          $("previewBtn").hidden = true;
          refreshInfo().catch(() => {});
          setStatus(
            data.message || "Обе подписи сохранены. Формируем подписанный PDF с ЭЦП и QR…",
            data.status === "document_error" ? "bad" : "",
          );
          startPolling();
          return;
        }
        if (data.status === "signed") {
          stopPolling();
          $("startBtn").hidden = true;
          $("ncalayerBtn").hidden = true;
          $("desktopNote").hidden = true;
          $("signBox").classList.remove("visible");
          refreshInfo().catch(() => {});
          setStatus("Готово — PDF содержит исходный АВР, обе ЭЦП и QR проверки.", "ok");
          return;
        }
        if (data.status === "partially_signed") {
          stopPolling();
          refreshInfo().catch(() => {});
          showReady(true);
          setStatus("Первая подпись получена. Документ готов для подписи второй стороны.", "ok");
          return;
        }
        if (data.status === "error") {
          stopPolling();
          showReady(false);
          $("startBtn").textContent = "Повторить завершение подписи";
          setStatus(data.message || "Подписание не завершено. Повторите попытку.", "bad");
          return;
        }
        if (data.status === "finalizing") {
          $("signBox").classList.remove("visible");
          $("startBtn").hidden = true;
          $("ncalayerBtn").hidden = true;
          $("desktopNote").hidden = true;
          setStatus(data.message || "Подпись получена. Проверяем сертификат и сохраняем результат…");
          startPolling();
          return;
        }
        if (data.status === "signing") {
          startPolling();
          if (isMobile) {
            $("signBox").classList.remove("visible");
            $("startBtn").hidden = true;
            $("ncalayerBtn").hidden = true;
            $("desktopNote").hidden = true;
            if (allowMobileLaunch) {
              if (!data.egov_mobile_url) {
                stopPolling();
                showReady(false);
                setStatus("eGov не вернул ссылку для запуска мобильного приложения.", "bad");
                return;
              }
              setStatus("Открываем eGov Mobile… После подписи вернитесь на эту страницу.");
              window.setTimeout(() => location.assign(data.egov_mobile_url), 120);
            } else {
              setStatus("Ожидаем результат из eGov Mobile…");
            }
            return;
          }
          if (data.qr_code) {
            $("qr").src = data.qr_code;
            $("signBox").classList.add("visible");
          }
          $("startBtn").hidden = true;
          $("ncalayerBtn").hidden = false;
          $("desktopNote").hidden = false;
          setStatus("Ожидаем подпись через QR. Либо подпишите ЭЦП через NCALayer на этом компьютере.");
          return;
        }
        showReady(data.status === "partially_signed");
      }

      async function poll() {
        try { renderSession(await request("/status")); }
        catch (error) { stopPolling(); showReady(false); setStatus(error.message, "bad"); }
      }

      function bytesToBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        const chunk = 0x8000;
        for (let offset = 0; offset < bytes.length; offset += chunk) {
          binary += String.fromCharCode(...bytes.subarray(offset, Math.min(offset + chunk, bytes.length)));
        }
        return btoa(binary);
      }

      function signWithNCALayer(dataBase64) {
        return new Promise((resolve, reject) => {
          let settled = false;
          let connected = false;
          const socket = new WebSocket("wss://127.0.0.1:13579");
          const finish = (error, result) => {
            if (settled) return;
            settled = true;
            clearTimeout(timeout);
            try { socket.close(); } catch (_) {}
            if (error) reject(error); else resolve(result);
          };
          const timeout = window.setTimeout(() => finish(new Error("NCALayer не ответил. Проверьте, что приложение установлено и запущено.")), 180000);
          socket.onerror = () => finish(new Error("Не удалось подключиться к NCALayer. Запустите NCALayer и повторите попытку."));
          socket.onclose = () => { if (!settled) finish(new Error("NCALayer закрыл соединение до завершения подписи.")); };
          socket.onmessage = (event) => {
            let response;
            try { response = JSON.parse(event.data); }
            catch (_) { finish(new Error("NCALayer вернул некорректный ответ.")); return; }
            if (!connected) {
              if (!response?.result?.version) {
                finish(new Error("Не удалось определить версию NCALayer."));
                return;
              }
              connected = true;
              socket.send(JSON.stringify({
                module: "kz.gov.pki.knca.basics",
                method: "sign",
                args: {
                  allowedStorages: null,
                  format: "cms",
                  data: dataBase64,
                  signingParams: { decode: true, encapsulate: false, digested: false, tsaProfile: {} },
                  signerParams: { extKeyUsageOids: ["1.3.6.1.5.5.7.3.4"] },
                  locale: "ru",
                },
              }));
              return;
            }
            if (!response?.status) {
              finish(new Error(response?.message || "Подписание отменено или NCALayer вернул ошибку."));
              return;
            }
            let signature = response?.body?.result;
            if (Array.isArray(signature)) signature = signature[0];
            if (!signature) {
              finish(new Error("Подписание отменено пользователем."));
              return;
            }
            finish(null, String(signature));
          };
        });
      }

      $("startBtn").onclick = async () => {
        setSigningButtonsDisabled(true);
        $("startBtn").textContent = isMobile ? "Открываем eGov Mobile…" : "Создаём QR…";
        try {
          const session = await request("/session", { method: "POST" });
          renderSession(session, { allowMobileLaunch: isMobile });
        } catch (error) {
          showReady(false);
          setStatus(error.message, "bad");
        }
      };

      $("ncalayerBtn").onclick = async () => {
        setSigningButtonsDisabled(true);
        $("ncalayerBtn").textContent = "Подключаемся к NCALayer…";
        setStatus("Откроется окно NCALayer для выбора ЭЦП и подтверждения подписи.");
        try {
          const fileResponse = await fetch(`/sign/avr/${encodeURIComponent(token)}/file`, { cache: "no-store" });
          if (!fileResponse.ok) throw new Error("Не удалось загрузить АВР для подписания.");
          const signature = await signWithNCALayer(bytesToBase64(await fileResponse.arrayBuffer()));
          $("ncalayerBtn").textContent = "Сохраняем подпись…";
          const result = await request("/ncalayer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ signature }),
          });
          renderSession(result);
        } catch (error) {
          showReady(Boolean(currentInfo?.status === "partially_signed"));
          setStatus(error.message, "bad");
        }
      };

      (async () => {
        try {
          const info = await refreshInfo();
          if (info.status === "signed") {
            if (info.signed_file_ready) {
              renderSession({ status: "signed", signed_file_ready: true });
            } else {
              renderSession(await request("/status"));
            }
            return;
          }
          const session = await request("/status");
          if (["signing", "finalizing", "error", "partially_signed", "document_building", "document_error"].includes(session.status)) {
            renderSession(session);
          } else {
            showReady(false);
            setStatus(isMobile
              ? "Документ готов. По кнопке сразу откроется eGov Mobile."
              : "Выберите QR для eGov Mobile или ЭЦП через NCALayer.");
          }
        } catch (error) {
          $("lead").textContent = "Не удалось открыть документ";
          setStatus(error.message, "bad");
        }
      })();
    })();
  </script>
</body>
</html>

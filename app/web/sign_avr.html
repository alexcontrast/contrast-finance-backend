<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Подписание АВР · Contrast</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; color: #1d241b; background: #eef5e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; background: radial-gradient(circle at top left, #dfffca, transparent 40%), #eef5e9; }
    .card { width: min(560px, 100%); background: rgba(255,255,255,.96); border: 1px solid #cfe1c4; border-radius: 24px; padding: 24px; box-shadow: 0 24px 70px rgba(35,63,24,.14); }
    .eyebrow { color: #43a519; font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 7px 0 4px; font-size: clamp(24px, 6vw, 34px); }
    .muted { color: #747d70; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
    .summary div { padding: 12px; background: #f4f7f1; border-radius: 14px; }
    .summary small { display: block; color: #81897d; margin-bottom: 5px; }
    .summary strong { font-size: 14px; overflow-wrap: anywhere; }
    button, .button { width: 100%; min-height: 48px; border: 1px solid #87cb65; border-radius: 14px; background: #d9ffbf; color: #20351a; font: inherit; font-weight: 850; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; }
    .button.secondary { background: #fff; border-color: #cfd8ca; margin-top: 8px; }
    button:disabled { cursor: wait; opacity: .65; }
    .preview { margin-top: 9px; }
    .sign-box { display: none; text-align: center; margin-top: 18px; padding-top: 18px; border-top: 1px solid #e2e8de; }
    .sign-box.visible { display: block; }
    .qr { width: min(280px, 85vw); height: min(280px, 85vw); object-fit: contain; border: 10px solid white; border-radius: 16px; box-shadow: 0 8px 26px rgba(0,0,0,.1); }
    .launch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .launch .button { margin: 0; padding: 8px; }
    .status { min-height: 44px; margin-top: 14px; padding: 12px; border-radius: 12px; background: #f2f5ef; font-size: 14px; }
    .status.ok { color: #175d25; background: #e0f8d8; }
    .status.bad { color: #8a2b22; background: #fff0ec; }
    @media (max-width: 500px) { .card { padding: 18px; border-radius: 18px; } .summary, .launch { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Contrast Finance · SIGEX</div>
    <h1>Подписание АВР</h1>
    <p id="lead" class="muted">Загружаем данные документа…</p>
    <section id="summary" class="summary" hidden>
      <div><small>Документ</small><strong id="actNumber">—</strong></div>
      <div><small>Сумма</small><strong id="amount">—</strong></div>
      <div><small>Подписант</small><strong id="signer">—</strong></div>
      <div><small>Исполнитель</small><strong id="contractor">—</strong></div>
    </section>
    <button id="startBtn" type="button" hidden>Подписать через eGov</button>
    <a id="previewBtn" class="button secondary preview" href="#" target="_blank" rel="noopener" hidden>Открыть АВР</a>
    <section id="signBox" class="sign-box" aria-live="polite">
      <img id="qr" class="qr" alt="QR для подписания в eGov" />
      <p class="muted">Сканируйте QR в eGov Mobile или откройте приложение на этом телефоне:</p>
      <div class="launch">
        <a id="mobileLink" class="button" href="#">eGov Mobile</a>
        <a id="businessLink" class="button secondary" href="#">eGov Business</a>
      </div>
    </section>
    <div id="status" class="status">Проверяем ссылку…</div>
  </main>
  <script>
    (() => {
      const token = location.pathname.split("/").filter(Boolean).pop();
      const $ = (id) => document.getElementById(id);
      let timer = null;
      const money = (value) => `${new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(Number(value || 0))} ₸`;
      const setStatus = (text, type = "") => { $("status").textContent = text; $("status").className = `status ${type}`.trim(); };
      async function request(path, options) {
        const response = await fetch(`/sign/avr/${encodeURIComponent(token)}${path}`, options);
        let data = null;
        try { data = await response.json(); } catch (_) {}
        if (!response.ok) throw new Error(typeof data?.detail === "string" ? data.detail : `Ошибка ${response.status}`);
        return data;
      }
      function renderSession(data) {
        if (data.status === "signed") {
          clearInterval(timer); timer = null;
          $("startBtn").hidden = true; $("signBox").classList.remove("visible");
          setStatus("Готово — подпись проверена и сохранена в SIGEX.", "ok");
          return;
        }
        if (data.status === "error") {
          clearInterval(timer); timer = null;
          $("startBtn").hidden = false; $("startBtn").disabled = false; $("startBtn").textContent = "Попробовать ещё раз";
          $("signBox").classList.remove("visible");
          setStatus(data.message || "Подписание не завершено. Создайте новый QR.", "bad");
          return;
        }
        if (data.qr_code) {
          $("qr").src = data.qr_code;
          $("mobileLink").href = data.egov_mobile_url || "#";
          $("businessLink").href = data.egov_business_url || "#";
          $("mobileLink").hidden = !data.egov_mobile_url;
          $("businessLink").hidden = !data.egov_business_url;
          $("signBox").classList.add("visible");
          $("startBtn").hidden = true;
          setStatus("Ожидаем подпись в приложении eGov…");
        }
      }
      async function poll() {
        try { renderSession(await request("/status")); }
        catch (error) { clearInterval(timer); timer = null; setStatus(error.message, "bad"); }
      }
      $("startBtn").onclick = async () => {
        $("startBtn").disabled = true; $("startBtn").textContent = "Создаём QR…";
        try {
          renderSession(await request("/session", { method: "POST" }));
          if (!timer) timer = setInterval(poll, 2500);
        } catch (error) {
          $("startBtn").disabled = false; $("startBtn").textContent = "Попробовать ещё раз"; setStatus(error.message, "bad");
        }
      };
      (async () => {
        try {
          const data = await request("/info");
          $("lead").textContent = data.status === "signed" ? "Эта сторона уже подписала документ." : "Проверьте документ и подпишите его своей ЭЦП.";
          $("actNumber").textContent = `${data.act_number} от ${new Date(`${data.act_date}T00:00:00`).toLocaleDateString("ru-RU")}`;
          $("amount").textContent = money(data.amount);
          $("signer").textContent = data.signer_label;
          $("contractor").textContent = data.contractor_name;
          $("summary").hidden = false; $("previewBtn").hidden = false;
          $("previewBtn").href = `/sign/avr/${encodeURIComponent(token)}/file`;
          if (data.status === "signed") setStatus("Готово — подпись уже сохранена в SIGEX.", "ok");
          else { $("startBtn").hidden = false; setStatus("Документ готов к подписанию."); }
        } catch (error) { $("lead").textContent = "Не удалось открыть документ"; setStatus(error.message, "bad"); }
      })();
    })();
  </script>
</body>
</html>
